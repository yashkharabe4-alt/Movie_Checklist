<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Watch List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Personal collection</p>
          <h1>Movie Watch List</h1>
          <p class="subtitle">Keep track of what you want to watch and what you have finished.</p>
        </div>
        <button class="primary-button" id="show-form" type="button">+ Add movie</button>
      </header>

      <section class="stats" aria-label="Watch list statistics">
        <article class="stat-card"><span>Total movies</span><strong id="total-count">0</strong></article>
        <article class="stat-card"><span>To watch</span><strong id="watchlist-count">0</strong></article>
        <article class="stat-card"><span>Watched</span><strong id="watched-count">0</strong></article>
        <article class="stat-card"><span>Completion</span><strong id="completion-rate">0%</strong></article>
      </section>

      <section class="toolbar" aria-label="Movie controls">
        <label class="search-box" for="search"><span>⌕</span><input id="search" type="search" placeholder="Search movies" /></label>
        <label for="filter-status" class="select-label">Show
          <select id="filter-status">
            <option value="all">All movies</option>
            <option value="to-watch">To watch</option>
            <option value="watched">Watched</option>
          </select>
        </label>
      </section>

      <section class="movie-section" aria-labelledby="list-heading">
        <div class="section-heading"><h2 id="list-heading">Your list</h2><span id="result-count"></span></div>
        <div class="movie-grid" id="movie-list"></div>
        <div class="empty-state" id="empty-state" hidden>
          <p>No movies match this view.</p>
          <button class="text-button" id="clear-filters" type="button">Clear search and filters</button>
        </div>
      </section>
    </main>

    <dialog id="movie-dialog">
      <form id="movie-form" method="dialog">
        <div class="dialog-heading"><h2>Add a movie</h2><button class="close-button" id="close-form" type="button" aria-label="Close">×</button></div>
        <label>Movie title<input id="title" name="title" required maxlength="70" placeholder="e.g. Interstellar" /></label>
        <div class="form-row">
          <label>Year<input id="year" name="year" type="number" min="1888" max="2100" placeholder="2014" /></label>
          <label>Genre<input id="genre" name="genre" maxlength="30" placeholder="Sci-fi" /></label>
        </div>
        <label>Status
          <select id="status" name="status"><option value="to-watch">To watch</option><option value="watched">Watched</option></select>
        </label>
        <div class="dialog-actions"><button class="secondary-button" id="cancel-form" type="button">Cancel</button><button class="primary-button" type="submit">Save movie</button></div>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
